[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-gateway"
version = "0.1.0"
description = "Universal agent protocol gateway — translate between A2A, MCP, OpenAI Assistants, and REST in one config file."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Naveen Kumar Baskaran", email = "naveenkumarbaskaran@outlook.com" },
]
keywords = [
    "agent", "gateway", "a2a", "mcp", "openai", "protocol",
    "translation", "interoperability", "ai", "multi-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.25",
    "pydantic>=2.0",
]

[project.optional-dependencies]
server = ["uvicorn>=0.27", "fastapi>=0.110"]
all = ["uvicorn>=0.27", "fastapi>=0.110"]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
agent-gateway = "agent_gateway.cli:main"

[project.urls]
Homepage = "https://github.com/naveenkumarbaskaran/agent-gateway"
Repository = "https://github.com/naveenkumarbaskaran/agent-gateway"
Issues = "https://github.com/naveenkumarbaskaran/agent-gateway/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gateway"]

[tool.hatch.build.targets.sdist]
include = ["src/agent_gateway", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
