[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-gateway"
version = "2.0.0"
description = "Universal agent protocol gateway — translate between A2A, MCP, OpenAI Assistants, and REST in one config file."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Naveen Kumar Baskaran", email = "naveenkb142@gmail.com" },
]
keywords = [
    "agent", "gateway", "a2a", "mcp", "openai", "protocol",
    "translation", "interoperability", "ai", "multi-agent", "routing",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pydantic>=2.5",
    "tenacity>=8.2",
]

[project.optional-dependencies]
server = ["uvicorn>=0.30", "fastapi>=0.115"]
all = ["uvicorn>=0.30", "fastapi>=0.115"]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
agent-gateway = "agent_gateway.cli:main"

[project.urls]
Homepage = "https://github.com/naveenkumarbaskaran/agent-gateway"
Repository = "https://github.com/naveenkumarbaskaran/agent-gateway"
Issues = "https://github.com/naveenkumarbaskaran/agent-gateway/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gateway"]

[tool.hatch.build.targets.sdist]
include = ["src/agent_gateway", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
